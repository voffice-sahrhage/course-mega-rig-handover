# Plan morning-digest § 3 and § 4 (ADR 0003): save /digest/2026-10-28 as one HTML file and publish
# it on GitHub Pages. The preview is built here and never committed. LANE_MARKER comes from the
# repo secret of that name; delete the secret and run this again to take the marker off the same link.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PORT: '8787'
        run: |
          pnpm start > rig.log 2>&1 &
          for _ in $(seq 30); do curl -fsS http://localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS http://localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1
          grep -o '<span class="marker">[^<]*</span>' _site/index.html | sed 's/>[^<]*</>…</' # marker present, value not logged
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
